<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avalanche Escape</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color: #0f172a;
    }
    /* Native Keyboard Input Box for High Scores */
    #initialsInput {
      position: absolute;
      display: none;
      width: 140px;
      height: 48px;
      font-family: monospace, sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #0284c7;
      background: #0f172a;
      border: 3px solid #f59e0b;
      border-radius: 6px;
      outline: none;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
      z-index: 100;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <input type="text" id="initialsInput" maxlength="3" placeholder="SKI" autocomplete="off" spellcheck="false">

<script>
// --- LOCAL STORAGE & SETTINGS PERSISTENCE (SAFE GUARDED) ---
const STORAGE_PREFIX = 'avalanche_escape_';

function getStorage(key, fallback) {
  try {
    const val = localStorage.getItem(STORAGE_PREFIX + key);
    return val !== null ? JSON.parse(val) : fallback;
  } catch (e) {
    return fallback;
  }
}

function setStorage(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {}
}

let bestDistance = getStorage('best', 0);
let cocoaMugs = getStorage('mugs', 0);
let unlockedSkins = getStorage('skins', ['default']);
let equippedSkin = getStorage('equipped_skin', 'default');
let leaderboard = getStorage('leaderboard', [
  { initials: 'ALP', distance: 1800 },
  { initials: 'SNW', distance: 1400 },
  { initials: 'ICE', distance: 1100 },
  { initials: 'SKI', distance: 850 },
  { initials: 'BRR', distance: 600 }
]);

let settings = getStorage('settings', {
  sfxOn: true,
  volume: 0.8,
  haptics: true
});

const SKINS = {
  default: { id: 'default', name: 'Alpine Racer', cost: 0, suitColor: '#ef4444', scarfColor: '#f1f5f9', accentColor: '#38bdf8' },
  neon: { id: 'neon', name: 'Neon Nitro', cost: 20, suitColor: '#06b6d4', scarfColor: '#f43f5e', accentColor: '#a855f7' },
  retro: { id: 'retro', name: 'Retro Shredder', cost: 40, suitColor: '#f59e0b', scarfColor: '#10b981', accentColor: '#3b82f6' },
  gold: { id: 'gold', name: 'Golden Summit', cost: 75, suitColor: '#eab308', scarfColor: '#ffffff', accentColor: '#0f172a' }
};

// High Score Typing & Game States (Declared at the Top)
let gameState = 'MENU'; // MENU (Live Summit), HUB, SETTINGS, SHOP, LEADERBOARD, COUNTDOWN, PLAYING, PAUSED, GAMEOVER
let previousMenuState = 'HUB';
let isHighScoreRun = false;
let scoreSubmitted = false;
let countdownTimer = 3;
let countdownInterval = null;

// World & Physics
let width = window.innerWidth;
let height = window.innerHeight;
let distance = 0;
let runMugsCollected = 0;
let cameraY = 0;
let screenShake = 0;
let timeAlive = 0;

const initialsInputEl = document.getElementById('initialsInput');

function saveState() {
  setStorage('best', bestDistance);
  setStorage('mugs', cocoaMugs);
  setStorage('skins', unlockedSkins);
  setStorage('equipped_skin', equippedSkin);
  setStorage('leaderboard', leaderboard);
  setStorage('settings', settings);

  if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
    window.GlacierPlay.onScoreUpdate(distance, bestDistance);
  }
}

function triggerHaptic(pattern) {
  if (settings.haptics && navigator.vibrate) {
    navigator.vibrate(pattern);
  }
}

function checkHighScore(newDist) {
  if (newDist <= 0) return false;
  return leaderboard.length < 10 || newDist > leaderboard[leaderboard.length - 1].distance;
}

function submitHighScoreFromInput() {
  let val = initialsInputEl.value.trim().toUpperCase();
  if (val.length === 0) val = 'SKI';
  while (val.length < 3) val += 'X';

  leaderboard.push({ initials: val, distance: Math.floor(distance) });
  leaderboard.sort((a, b) => b.distance - a.distance);
  if (leaderboard.length > 10) leaderboard.pop();

  scoreSubmitted = true;
  hideInitialsInput();
  saveState();
}

function showInitialsInput() {
  const cardY = height * 0.12;
  initialsInputEl.style.left = `${width / 2 - 70}px`;
  initialsInputEl.style.top = `${cardY + 225}px`;
  initialsInputEl.style.display = 'block';
  initialsInputEl.value = 'SKI';
  setTimeout(() => initialsInputEl.focus(), 50);
}

function hideInitialsInput() {
  initialsInputEl.style.display = 'none';
  initialsInputEl.blur();
}

// --- SYNTHESIZED WEB AUDIO ENGINE ---
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.rumbleGain = null;
    this.rumbleSource = null;
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();
    this.setupRumble();
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setupRumble() {
    if (!this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    this.rumbleSource = this.ctx.createBufferSource();
    this.rumbleSource.buffer = noiseBuffer;
    this.rumbleSource.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 110;

    this.rumbleGain = this.ctx.createGain();
    this.rumbleGain.gain.value = 0.0;

    this.rumbleSource.connect(filter);
    filter.connect(this.rumbleGain);
    this.rumbleGain.connect(this.ctx.destination);
    this.rumbleSource.start();
  }

  setRumbleVolume(volume) {
    if (this.rumbleGain && this.ctx) {
      const vol = settings.sfxOn ? Math.min(volume * settings.volume, 0.4) : 0;
      this.rumbleGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);
    }
  }

  playCarve() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playJump() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.25 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
  }

  playPickup() {
    if (!this.ctx || !settings.sfxOn) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = this.ctx.currentTime + (idx * 0.05);
      gain.gain.setValueAtTime(0.22 * settings.volume, startTime);
      gain.gain.linearRampToValueAtTime(0.01, startTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.1);
    });
  }

  playCrash() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(25, this.ctx.currentTime + 0.38);
    gain.gain.setValueAtTime(0.45 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.38);
  }
}

const audio = new AudioEngine();

// --- CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  if (gameState === 'GAMEOVER' && isHighScoreRun && !scoreSubmitted) {
    showInitialsInput();
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Ambient Snow Particles
const ambientSnow = Array.from({ length: 45 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 2 + 1,
  speed: Math.random() * 60 + 30,
  drift: Math.random() * 20 - 10
}));

const lensSnow = Array.from({ length: 14 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 8 + 6,
  speed: Math.random() * 180 + 120,
  drift: Math.random() * 50 - 25,
  alpha: Math.random() * 0.35 + 0.15
}));

// Player Setup
const player = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  z: 0,
  vz: 0,
  angle: 0,
  isJumping: false,
  isTucking: false,
  tuckTimer: 0,
  squashX: 1,
  squashY: 1,
  scarfWave: 0,
  reset() {
    this.x = width / 2;
    this.y = 0;
    this.vx = 0;
    this.vy = 280;
    this.z = 0;
    this.vz = 0;
    this.angle = 0;
    this.isJumping = false;
    this.isTucking = false;
    this.tuckTimer = 0;
    this.squashX = 1;
    this.squashY = 1;
    this.scarfWave = 0;
  }
};

// Avalanche Setup
let avalancheY = -400;
let avalancheSpeed = 260;

// Entities & Particles
let obstacles = [];
let particles = [];
let powderSpray = [];
let carveTrails = [];

// --- TIME OF DAY LIGHTING ---
function getTimeOfDayLighting() {
  const cycle = (distance % 2000) / 2000;
  
  if (cycle < 0.25) {
    const t = cycle / 0.25;
    return {
      skyTop: blendColor('#0f172a', '#0284c7', t),
      skyBottom: blendColor('#f97316', '#bae6fd', t),
      snowTop: blendColor('#ffedd5', '#f8fafc', t),
      snowBottom: blendColor('#fed7aa', '#cbd5e1', t),
      sunAngle: -0.6 + t * 0.3,
      isNight: false
    };
  } else if (cycle < 0.50) {
    const t = (cycle - 0.25) / 0.25;
    return {
      skyTop: blendColor('#0284c7', '#0369a1', t),
      skyBottom: blendColor('#bae6fd', '#e0f2fe', t),
      snowTop: blendColor('#f8fafc', '#f1f5f9', t),
      snowBottom: blendColor('#cbd5e1', '#94a3b8', t),
      sunAngle: -0.3 + t * 0.4,
      isNight: false
    };
  } else if (cycle < 0.75) {
    const t = (cycle - 0.50) / 0.25;
    return {
      skyTop: blendColor('#0369a1', '#312e81', t),
      skyBottom: blendColor('#e0f2fe', '#f43f5e', t),
      snowTop: blendColor('#f1f5f9', '#fecdd3', t),
      snowBottom: blendColor('#94a3b8', '#64748b', t),
      sunAngle: 0.1 + t * 0.5,
      isNight: false
    };
  } else {
    const t = (cycle - 0.75) / 0.25;
    return {
      skyTop: blendColor('#312e81', '#0f172a', t),
      skyBottom: blendColor('#f43f5e', '#1e1b4b', t),
      snowTop: blendColor('#fecdd3', '#e2e8f0', t),
      snowBottom: blendColor('#64748b', '#334155', t),
      sunAngle: 0.6,
      isNight: true
    };
  }
}

function blendColor(c1, c2, t) {
  const hex = (c) => parseInt(c.replace('#', ''), 16);
  const r1 = (hex(c1) >> 16) & 255, g1 = (hex(c1) >> 8) & 255, b1 = hex(c1) & 255;
  const r2 = (hex(c2) >> 16) & 255, g2 = (hex(c2) >> 8) & 255, b2 = hex(c2) & 255;
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

// --- PROCEDURAL OBSTACLE SPAWNING ---
function spawnObstaclesAhead() {
  const spawnDistance = player.y + height + 350;
  const lastSpawnY = obstacles.length > 0 ? obstacles[obstacles.length - 1].y : player.y + 250;

  if (lastSpawnY < spawnDistance) {
    const nextY = lastSpawnY + 65 + Math.random() * 45;
    const slopeMargin = width * 0.12;
    const nextX = slopeMargin + Math.random() * (width - slopeMargin * 2);

    const rand = Math.random();
    let type = 'TREE';
    if (rand < 0.35) type = 'TREE';
    else if (rand < 0.58) type = 'BOULDER';
    else if (rand < 0.72) type = 'ICE';
    else if (rand < 0.86) type = 'RAMP';
    else type = 'MUG';

    obstacles.push({ x: nextX, y: nextY, type, hit: false, steamTimer: Math.random() * 10 });
  }
}

// --- PARTICLE SYSTEM ---
function addSnowburst(x, y, count = 12, colorOverride = null) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      size: 3 + Math.random() * 5,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color: colorOverride || (Math.random() < 0.6 ? '#ffffff' : '#bae6fd')
    });
  }
}

function addPowderSpray(x, y, dir) {
  for (let i = 0; i < 3; i++) {
    powderSpray.push({
      x: x + (Math.random() - 0.5) * 12,
      y: y + (Math.random() - 0.5) * 8,
      vx: -dir * (30 + Math.random() * 60),
      vy: -Math.random() * 30 - 20,
      radius: 4 + Math.random() * 6,
      alpha: 0.6,
      life: 0.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = powderSpray.length - 1; i >= 0; i--) {
    const p = powderSpray[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.radius += dt * 10;
    p.alpha -= dt * 1.2;
    if (p.alpha <= 0) powderSpray.splice(i, 1);
  }

  for (let i = carveTrails.length - 1; i >= 0; i--) {
    carveTrails[i].alpha -= dt * 0.75;
    if (carveTrails[i].alpha <= 0) carveTrails.splice(i, 1);
  }

  ambientSnow.forEach(s => {
    s.y += (s.speed + (gameState === 'PLAYING' ? player.vy * 0.5 : 20)) * dt;
    s.x += s.drift * dt;
    if (s.y > height) { s.y = -10; s.x = Math.random() * width; }
    if (s.x < 0) s.x = width;
    if (s.x > width) s.x = 0;
  });

  lensSnow.forEach(s => {
    s.y += (s.speed + (gameState === 'PLAYING' ? player.vy * 0.9 : 40)) * dt;
    s.x += s.drift * dt;
    if (s.y > height + 20) { s.y = -20; s.x = Math.random() * width; }
    if (s.x < -20) s.x = width + 20;
    if (s.x > width + 20) s.x = -20;
  });
}

// --- CONTROLS & HYBRID TOUCH ---
let touchStartX = 0;
let touchStartY = 0;
let isPointerDown = false;
let pointerCurrentX = 0;
let pointerCurrentY = 0;
const SWIPE_THRESHOLD = 22;

function triggerSteer(dir) {
  if (gameState !== 'PLAYING') return;
  player.vx += dir * 240;
  player.angle = dir * 0.38;
  audio.playCarve();
  addPowderSpray(player.x, player.y - cameraY, dir);
}

function triggerJump() {
  if (gameState !== 'PLAYING') return;
  if (!player.isJumping) {
    player.isJumping = true;
    player.vz = 370;
    audio.playJump();
    triggerHaptic(20);
    player.squashX = 0.75;
    player.squashY = 1.25;
  }
}

function triggerTuck() {
  if (gameState !== 'PLAYING') return;
  player.isTucking = true;
  player.tuckTimer = 1.2;
  triggerHaptic([15, 30]);
  addSnowburst(player.x, player.y - cameraY, 8);
}

function togglePause() {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSED';
    screenShake = 0;
    audio.setRumbleVolume(0);
  } else if (gameState === 'PAUSED') {
    gameState = 'PLAYING';
  }
}

window.addEventListener('touchstart', (e) => {
  audio.init();
  audio.resume();
  const touch = e.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  pointerCurrentX = touch.clientX;
  pointerCurrentY = touch.clientY;
  isPointerDown = true;

  handleMenuTouch(touchStartX, touchStartY);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (!isPointerDown) return;
  const touch = e.changedTouches[0];
  pointerCurrentX = touch.clientX;
  pointerCurrentY = touch.clientY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;

  if (gameState !== 'PLAYING') return;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  // Top-Left Pause Button
  if (touchStartX >= 10 && touchStartX <= 120 && touchStartY >= 10 && touchStartY <= 60) {
    togglePause();
    return;
  }

  if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
    if (Math.abs(dx) > Math.abs(dy)) {
      triggerSteer(dx > 0 ? 1 : -1);
    } else {
      if (dy < 0) triggerJump();
      else triggerTuck();
    }
  }
}, { passive: false });

// Desktop Keyboard Fallback
const keys = {};
window.addEventListener('keydown', (e) => {
  audio.init();
  audio.resume();
  keys[e.code] = true;

  if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
    return;
  }

  if (gameState === 'PLAYING') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') triggerSteer(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') triggerSteer(1);
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') triggerJump();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerTuck();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// --- GAME FLOW LOGIC ---
function startCountdown() {
  hideInitialsInput();
  gameState = 'COUNTDOWN';
  screenShake = 0;
  countdownTimer = 3;
  player.reset();
  avalancheY = -400;
  avalancheSpeed = 260;
  distance = 0;
  runMugsCollected = 0;
  timeAlive = 0;
  isHighScoreRun = false;
  scoreSubmitted = false;
  obstacles = [];
  particles = [];
  powderSpray = [];
  carveTrails = [];

  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdownTimer--;
    if (countdownTimer <= 0) {
      clearInterval(countdownInterval);
      gameState = 'PLAYING';
    }
  }, 1000);
}

function handleMenuTouch(x, y) {
  if (gameState === 'MENU') {
    if (x >= 10 && x <= 120 && y >= 10 && y <= 60) {
      gameState = 'HUB';
      return;
    }
    const btnW = Math.min(width * 0.78, 340);
    const btnH = 56;
    const btnY = height * 0.62;
    if (x >= (width - btnW) / 2 && x <= (width + btnW) / 2 && y >= btnY && y <= btnY + btnH) {
      startCountdown();
    }
  } else if (gameState === 'HUB') {
    if (y > height * 0.32 && y < height * 0.40) gameState = 'SHOP';
    if (y > height * 0.44 && y < height * 0.52) gameState = 'LEADERBOARD';
    if (y > height * 0.56 && y < height * 0.64) { previousMenuState = 'HUB'; gameState = 'SETTINGS'; }
    if (y > height * 0.72) gameState = 'MENU';
  } else if (gameState === 'PAUSED') {
    if (y > height * 0.36 && y < height * 0.44) gameState = 'PLAYING';
    if (y > height * 0.48 && y < height * 0.56) startCountdown();
    if (y > height * 0.60 && y < height * 0.68) { previousMenuState = 'PAUSED'; gameState = 'SETTINGS'; }
    if (y > height * 0.72) { screenShake = 0; gameState = 'MENU'; }
  } else if (gameState === 'SETTINGS') {
    if (y > height * 0.34 && y < height * 0.42) {
      settings.sfxOn = !settings.sfxOn;
      saveState();
    }
    if (y > height * 0.46 && y < height * 0.54) {
      if (x < width / 2) settings.volume = Math.max(0, settings.volume - 0.1);
      else settings.volume = Math.min(1.0, settings.volume + 0.1);
      saveState();
    }
    if (y > height * 0.58 && y < height * 0.66) {
      settings.haptics = !settings.haptics;
      triggerHaptic(30);
      saveState();
    }
    if (y > height * 0.78) gameState = previousMenuState;
  } else if (gameState === 'SHOP') {
    let index = 0;
    for (let key in SKINS) {
      const s = SKINS[key];
      const skinY = height * 0.28 + index * 80;
      if (y > skinY && y < skinY + 65) {
        if (unlockedSkins.includes(s.id)) {
          equippedSkin = s.id;
          saveState();
        } else if (cocoaMugs >= s.cost) {
          cocoaMugs -= s.cost;
          unlockedSkins.push(s.id);
          equippedSkin = s.id;
          saveState();
          triggerHaptic([30, 50]);
        }
      }
      index++;
    }
    if (y > height * 0.84) gameState = 'HUB';
  } else if (gameState === 'LEADERBOARD') {
    if (y > height * 0.84) gameState = 'HUB';
  } else if (gameState === 'GAMEOVER') {
    if (isHighScoreRun && !scoreSubmitted) {
      if (y > height * 0.68 && y < height * 0.75) {
        submitHighScoreFromInput();
        audio.playPickup();
        return;
      }
    } else {
      if (y > height * 0.62 && y < height * 0.70) startCountdown();
      if (y > height * 0.72 && y < height * 0.80) { screenShake = 0; hideInitialsInput(); gameState = 'MENU'; }
    }
  }
}

// --- ENGINE UPDATE ---
function update(dt) {
  timeAlive += dt;

  if (gameState !== 'PLAYING') {
    audio.setRumbleVolume(0);
    return;
  }

  // Tap & Hold Continuous Steering
  if (isPointerDown) {
    if (pointerCurrentX < width * 0.42) {
      player.vx -= 480 * dt;
      player.angle = -0.32;
      addPowderSpray(player.x, player.y - cameraY, -1);
    } else if (pointerCurrentX > width * 0.58) {
      player.vx += 480 * dt;
      player.angle = 0.32;
      addPowderSpray(player.x, player.y - cameraY, 1);
    }
  }

  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx -= 480 * dt; player.angle = -0.32; }
  if (keys['ArrowRight'] || keys['KeyD']) { player.vx += 480 * dt; player.angle = 0.32; }

  if (player.isTucking) {
    player.tuckTimer -= dt;
    if (player.tuckTimer <= 0) player.isTucking = false;
  }

  const currentSkinKey = SKINS[equippedSkin] ? equippedSkin : 'default';
  const targetVy = (280 + distance * 0.045) * (player.isTucking ? 1.5 : 1.0);
  player.vy += (targetVy - player.vy) * 2.2 * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.vx *= 0.89;
  player.angle *= 0.86;
  player.scarfWave += dt * 12;

  const margin = width * 0.08;
  if (player.x < margin) { player.x = margin; player.vx = 0; }
  if (player.x > width - margin) { player.x = width - margin; player.vx = 0; }

  if (player.isJumping) {
    player.z += player.vz * dt;
    player.vz -= 920 * dt;
    if (player.z <= 0) {
      player.z = 0;
      player.vz = 0;
      player.isJumping = false;
      player.squashX = 1.35;
      player.squashY = 0.65;
      addSnowburst(player.x, player.y - cameraY, 12);
      triggerHaptic(20);
    }
  }

  player.squashX += (1 - player.squashX) * 8 * dt;
  player.squashY += (1 - player.squashY) * 8 * dt;

  if (!player.isJumping && Math.abs(player.vx) > 25) {
    carveTrails.push({
      x: player.x,
      y: player.y,
      alpha: 0.85,
      skinColor: SKINS[currentSkinKey].suitColor
    });
  }

  cameraY = player.y - height * 0.35;
  distance = player.y / 10;
  if (distance > bestDistance) bestDistance = Math.floor(distance);

  avalancheSpeed = 260 + (distance * 0.048);
  avalancheY += avalancheSpeed * dt;

  const avalancheProximity = player.y - avalancheY;
  const proximityRatio = Math.max(0, 1 - (avalancheProximity / 600));
  screenShake = proximityRatio * 15;
  audio.setRumbleVolume(proximityRatio);

  if (avalancheY >= player.y - 10) {
    triggerGameOver();
  }

  spawnObstaclesAhead();
  updateObstaclesAndCollisions();
  updateParticles(dt);
}

function updateObstaclesAndCollisions() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];

    if (obs.y < cameraY - 200) {
      obstacles.splice(i, 1);
      continue;
    }

    obs.steamTimer += 0.05;

    const dx = player.x - obs.x;
    const dy = player.y - obs.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 34) {
      if (obs.type === 'MUG') {
        if (!obs.hit) {
          obs.hit = true;
          cocoaMugs++;
          runMugsCollected++;
          audio.playPickup();
          triggerHaptic([30, 30]);
          addSnowburst(player.x, player.y - cameraY, 15, '#eab308');
          saveState();
        }
      } else if (obs.type === 'RAMP') {
        if (!obs.hit && !player.isJumping) {
          obs.hit = true;
          player.isJumping = true;
          player.vz = 580;
          audio.playJump();
          triggerHaptic(40);
          player.squashX = 0.6;
          player.squashY = 1.4;
          addSnowburst(player.x, player.y - cameraY, 16);
        }
      } else if (player.isJumping || player.z > 18) {
        // Clear obstacles mid-air!
      } else {
        if (!obs.hit) {
          if (obs.type === 'ICE') {
            obs.hit = true;
            player.vx = (Math.random() < 0.5 ? 1 : -1) * 380;
            player.angle = Math.PI * 0.6;
            audio.playCarve();
            triggerHaptic(30);
          } else if (obs.type === 'TREE' || obs.type === 'BOULDER') {
            obs.hit = true;
            player.vy = 40;
            screenShake = 22;
            audio.playCrash();
            triggerHaptic([60, 40, 60]);
            addSnowburst(player.x, player.y - cameraY, 24);
          }
        }
      }
    }
  }
}

function triggerGameOver() {
  gameState = 'GAMEOVER';
  screenShake = 0;
  audio.playCrash();
  triggerHaptic([100, 50, 100]);
  isHighScoreRun = checkHighScore(distance);
  scoreSubmitted = false;

  if (isHighScoreRun) {
    showInitialsInput();
  } else {
    hideInitialsInput();
  }

  saveState();
}

// --- RENDER ENGINE ---
function render() {
  ctx.clearRect(0, 0, width, height);

  const light = getTimeOfDayLighting();

  ctx.save();
  if (screenShake > 0.1 && gameState === 'PLAYING') {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
  }

  drawSkyAndAurora(light);
  drawSnowSlope(light);

  if (['PLAYING', 'COUNTDOWN', 'PAUSED', 'GAMEOVER'].includes(gameState)) {
    drawCarveTrails();
    drawObstacles(light);
    drawPowderSpray();
    drawParticles();
    drawPlayer(light);
    drawAvalancheWall();
    drawSpeedLines();
    drawDepthLensParticles();
    drawFrostVignette();
  }

  drawAmbientAtmosphere();
  ctx.restore();

  drawUI(light);
}

// 1. Dynamic Sky & Aurora
function drawSkyAndAurora(light) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.45);
  skyGrad.addColorStop(0, light.skyTop);
  skyGrad.addColorStop(1, light.skyBottom);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  if (light.isNight) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    const time = timeAlive * 0.6;
    const auroraGrad = ctx.createLinearGradient(0, 0, width, height * 0.3);
    auroraGrad.addColorStop(0, '#10b981');
    auroraGrad.addColorStop(0.5, '#06b6d4');
    auroraGrad.addColorStop(1, '#a855f7');
    ctx.fillStyle = auroraGrad;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= width; x += 30) {
      const y = Math.sin(x * 0.01 + time) * 40 + height * 0.12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, 0);
    ctx.fill();
    ctx.restore();
  }
}

// 2. Snow Slope
function drawSnowSlope(light) {
  const slopeGrad = ctx.createLinearGradient(0, height * 0.25, 0, height);
  slopeGrad.addColorStop(0, light.snowTop);
  slopeGrad.addColorStop(1, light.snowBottom);
  ctx.fillStyle = slopeGrad;
  ctx.fillRect(0, height * 0.25, width, height);

  const margin = width * 0.08;
  const treeGradLeft = ctx.createLinearGradient(0, 0, margin, 0);
  treeGradLeft.addColorStop(0, '#022c22');
  treeGradLeft.addColorStop(1, '#065f46');
  ctx.fillStyle = treeGradLeft;
  ctx.fillRect(0, 0, margin, height);

  const treeGradRight = ctx.createLinearGradient(width - margin, 0, width, 0);
  treeGradRight.addColorStop(0, '#065f46');
  treeGradRight.addColorStop(1, '#022c22');
  ctx.fillStyle = treeGradRight;
  ctx.fillRect(width - margin, 0, margin, height);
}

// 3. Carve Trails & Powder Spray
function drawCarveTrails() {
  carveTrails.forEach(t => {
    ctx.save();
    ctx.globalAlpha = t.alpha * 0.6;
    ctx.fillStyle = t.skinColor;
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y - cameraY, 2.5, 0, Math.PI * 2);
    ctx.arc(t.x + 3, t.y - cameraY, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPowderSpray() {
  powderSpray.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// 4. Vector Obstacles & Dynamic Shadows
function drawObstacles(light) {
  const shadowOffsetX = Math.cos(light.sunAngle) * 18;
  const shadowOffsetY = Math.sin(light.sunAngle) * 10 + 6;

  obstacles.forEach(obs => {
    if (obs.hit && obs.type === 'MUG') return;

    const screenY = obs.y - cameraY;
    if (screenY < -60 || screenY > height + 60) return;

    if (obs.type === 'TREE') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
      ctx.beginPath();
      ctx.ellipse(obs.x + shadowOffsetX, screenY + shadowOffsetY, 22, 7, light.sunAngle, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(obs.x - 4, screenY - 6, 8, 14);

      const layers = [
        { y: screenY - 8, w: 22, h: 22, col: '#065f46' },
        { y: screenY - 22, w: 17, h: 20, col: '#047857' },
        { y: screenY - 36, w: 12, h: 18, col: '#10b981' }
      ];
      layers.forEach(l => {
        ctx.fillStyle = l.col;
        ctx.beginPath();
        ctx.moveTo(obs.x, l.y - l.h);
        ctx.lineTo(obs.x - l.w, l.y);
        ctx.lineTo(obs.x + l.w, l.y);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(obs.x, l.y - l.h);
        ctx.lineTo(obs.x - l.w * 0.5, l.y - l.h * 0.5);
        ctx.lineTo(obs.x + l.w * 0.5, l.y - l.h * 0.5);
        ctx.fill();
      });

    } else if (obs.type === 'BOULDER') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
      ctx.beginPath();
      ctx.ellipse(obs.x + shadowOffsetX * 0.6, screenY + shadowOffsetY * 0.6, 18, 7, light.sunAngle, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY, 18, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.ellipse(obs.x - 4, screenY - 3, 10, 6, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.ellipse(obs.x - 2, screenY - 6, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

    } else if (obs.type === 'ICE') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.55)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY, 26, 14, 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.moveTo(obs.x - 12, screenY - 2);
      ctx.lineTo(obs.x + 8, screenY - 4);
      ctx.stroke();

    } else if (obs.type === 'RAMP') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY + 8, 22, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.moveTo(obs.x - 22, screenY + 10);
      ctx.lineTo(obs.x + 22, screenY + 10);
      ctx.lineTo(obs.x, screenY - 14);
      ctx.fill();

      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.moveTo(obs.x - 18, screenY + 8);
      ctx.lineTo(obs.x + 18, screenY + 8);
      ctx.lineTo(obs.x, screenY - 10);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(obs.x, screenY - 6);
      ctx.lineTo(obs.x - 5, screenY + 2);
      ctx.lineTo(obs.x + 5, screenY + 2);
      ctx.fill();

    } else if (obs.type === 'MUG') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(234, 179, 8, 0.45)';
      ctx.beginPath();
      ctx.arc(obs.x, screenY, 20 + Math.sin(obs.steamTimer * 2) * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(obs.x - 8, screenY - 8, 16, 16);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(obs.x - 6, screenY - 6, 12, 4);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(obs.x + 9, screenY, 4, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.5;
      const steamY = screenY - 10 - Math.sin(obs.steamTimer) * 4;
      ctx.beginPath();
      ctx.moveTo(obs.x - 3, steamY);
      ctx.lineTo(obs.x - 3, steamY - 6);
      ctx.moveTo(obs.x + 3, steamY - 2);
      ctx.lineTo(obs.x + 3, steamY - 8);
      ctx.stroke();
    }
  });
}

// 5. Player Vector Character
function drawPlayer(light) {
  const screenY = player.y - cameraY - player.z;
  const currentSkinKey = SKINS[equippedSkin] ? equippedSkin : 'default';
  const currentSkin = SKINS[currentSkinKey];
  const shadowOffsetX = Math.cos(light.sunAngle) * (14 + player.z * 0.1);
  const shadowOffsetY = Math.sin(light.sunAngle) * 8 + 12 + player.z * 0.6;

  ctx.save();
  ctx.translate(player.x, screenY);

  const shadowScale = 1 + player.z * 0.003;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(shadowOffsetX, shadowOffsetY, 14 * shadowScale, 5 * shadowScale, light.sunAngle, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(player.angle);
  ctx.scale(player.squashX, player.squashY);

  // Skis
  ctx.fillStyle = currentSkin.accentColor;
  ctx.fillRect(-9, -18, 4, 34);
  ctx.fillRect(5, -18, 4, 34);

  // Waving Scarf Physics
  const wave = Math.sin(player.scarfWave) * 6;
  ctx.fillStyle = currentSkin.scarfColor;
  ctx.beginPath();
  ctx.moveTo(0, 2);
  ctx.quadraticCurveTo(-10 + wave, 14, -6 + wave, 24);
  ctx.quadraticCurveTo(0, 14, 0, 2);
  ctx.fill();

  // Suit Body
  ctx.fillStyle = currentSkin.suitColor;
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();

  // Helmet & Visor
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, -2, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-5, -5, 10, 4);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-3, -5, 3, 2);

  ctx.restore();
}

// 6. Volumetric Avalanche Wall
function drawAvalancheWall() {
  const wallScreenY = avalancheY - cameraY;
  if (wallScreenY < -120) return;

  const grad = ctx.createLinearGradient(0, wallScreenY - 100, 0, wallScreenY + 60);
  grad.addColorStop(0, 'rgba(248, 250, 252, 0.98)');
  grad.addColorStop(0.5, 'rgba(226, 232, 240, 0.94)');
  grad.addColorStop(1, 'rgba(148, 163, 184, 0.0)');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(width, 0);
  ctx.lineTo(width, wallScreenY + 30);

  const time = Date.now() * 0.006;
  for (let x = width; x >= 0; x -= 30) {
    const wave = Math.sin(x * 0.02 + time) * 22;
    ctx.lineTo(x, wallScreenY + wave);
  }
  ctx.closePath();
  ctx.fill();
}

// 7. Frost Vignette & Lens Particles
function drawFrostVignette() {
  const prox = Math.max(0, 1 - ((player.y - avalancheY) / 500));
  if (prox <= 0.1) return;

  const grad = ctx.createRadialGradient(width / 2, height / 2, width * 0.3, width / 2, height / 2, width * 0.7);
  grad.addColorStop(0, 'rgba(186, 230, 253, 0.0)');
  grad.addColorStop(1, `rgba(186, 230, 253, ${prox * 0.55})`);

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);
}

function drawDepthLensParticles() {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  lensSnow.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSpeedLines() {
  if (!player.isTucking && player.z <= 0) return;

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2;
  const count = player.isTucking ? 16 : 8;
  for (let i = 0; i < count; i++) {
    const x = Math.random() * width;
    const y = Math.random() * height;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - 0.5) * 10, y + 40 + Math.random() * 40);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawAmbientAtmosphere() {
  ctx.fillStyle = '#ffffff';
  ambientSnow.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- SKI PASS & TRAIL SIGN HELPERS ---
function drawSkiPassCard(x, y, w, h, titleText) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(x + 6, y + 6, w, h);

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);

  const bannerH = 42;
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x, y, w, bannerH);
  
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(x, y + bannerH - 4, w, 4);

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(x + w / 2, y + 12, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = '900 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(titleText, x + w / 2, y + 30);
}

function drawTrailSignButton(text, y, color, symbolType = 'DIAMOND') {
  const btnW = Math.min(width * 0.74, 320);
  const btnH = 50;
  const btnX = (width - btnW) / 2;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(btnX + 4, y + 4, btnW, btnH);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(btnX, y, btnW, btnH);

  const accentW = 46;
  ctx.fillStyle = color;
  ctx.fillRect(btnX, y, accentW, btnH);

  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(btnX, y, btnW, btnH);

  ctx.save();
  ctx.translate(btnX + accentW / 2, y + btnH / 2);
  if (symbolType === 'CIRCLE') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();
  } else if (symbolType === 'SQUARE') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-7, -7, 14, 14);
  } else if (symbolType === 'DIAMOND') {
    ctx.fillStyle = '#ffffff';
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-7, -7, 14, 14);
  } else if (symbolType === 'GEAR') {
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚙', 0, 0);
  } else if (symbolType === 'RESORT') {
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏔', 0, 0);
  }
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, btnX + accentW + (btnW - accentW) / 2, y + btnH / 2);
}

// --- UI & OVERLAYS ---
function drawUI(light) {
  // TOP-LEFT CORNER MENU / PAUSE BUTTON
  if (['MENU', 'PLAYING'].includes(gameState)) {
    const btnX = 15;
    const btnY = 15;
    const btnW = 100;
    const btnH = 38;

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.strokeRect(btnX, btnY, btnW, btnH);

    ctx.fillStyle = '#f59e0b';
    ctx.font = '900 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(gameState === 'MENU' ? '☰ MENU' : '⏸ PAUSE', btnX + btnW / 2, btnY + btnH / 2);
  }

  // LIVE MOUNTAIN SUMMIT MAIN SCENE
  if (gameState === 'MENU') {
    const gateY = height * 0.22;
    const postX1 = width / 2 - 80;
    const postX2 = width / 2 + 80;

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(postX1 - 5, gateY - 50, 10, 60);
    ctx.fillRect(postX2 - 5, gateY - 50, 10, 60);

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(postX1, gateY - 45, 160, 28);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(postX1, gateY - 45, 160, 28);

    ctx.fillStyle = '#0f172a';
    ctx.font = '900 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SUMMIT 3000M', width / 2, gateY - 31);

    const wave1 = Math.sin(timeAlive * 6) * 6;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(postX1 - 25, gateY + 10);
    ctx.lineTo(postX1 - 45 + wave1, gateY + 18);
    ctx.lineTo(postX1 - 25, gateY + 26);
    ctx.fill();

    const wave2 = Math.cos(timeAlive * 6) * 6;
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(postX2 + 25, gateY + 10);
    ctx.lineTo(postX2 + 45 + wave2, gateY + 18);
    ctx.lineTo(postX2 + 25, gateY + 26);
    ctx.fill();

    const currentSkinKey = SKINS[equippedSkin] ? equippedSkin : 'default';
    const currentSkin = SKINS[currentSkinKey];
    const idleY = gateY + 15 + Math.sin(timeAlive * 3) * 2;
    ctx.save();
    ctx.translate(width / 2, idleY);

    ctx.fillStyle = currentSkin.accentColor;
    ctx.fillRect(-9, -14, 4, 28);
    ctx.fillRect(5, -14, 4, 28);

    const scarfWave = Math.sin(timeAlive * 8) * 5;
    ctx.fillStyle = currentSkin.scarfColor;
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.quadraticCurveTo(-8 + scarfWave, 10, -4 + scarfWave, 18);
    ctx.quadraticCurveTo(0, 10, 0, 2);
    ctx.fill();

    ctx.fillStyle = currentSkin.suitColor;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(0, -2, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 32px system-ui, sans-serif';
    ctx.fillText('AVALANCHE ESCAPE', width / 2, height * 0.44);

    const badgeW = 160;
    const badgeH = 42;
    const badgeX = width - badgeW - 15;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(badgeX, 15, badgeW, badgeH);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.strokeRect(badgeX, 15, badgeW, badgeH);

    ctx.fillStyle = '#f59e0b';
    ctx.font = '800 12px system-ui, sans-serif';
    ctx.fillText(`BEST: ${bestDistance}m`, badgeX + badgeW / 2, 28);
    ctx.fillText(`MUGS: ☕ ${cocoaMugs}`, badgeX + badgeW / 2, 44);

    drawTrailSignButton('EXPRESS DESCENT ▶', height * 0.62, '#10b981', 'CIRCLE');

  } else if (gameState === 'HUB') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    const cardW = Math.min(width * 0.88, 400);
    const cardH = height * 0.76;
    const cardX = (width - cardW) / 2;
    const cardY = height * 0.12;

    drawSkiPassCard(cardX, cardY, cardW, cardH, 'SKI RESORT HUB');

    drawTrailSignButton('EQUIPMENT SHOP', height * 0.32, '#0284c7', 'SQUARE');
    drawTrailSignButton('DESCENT RECORDS', height * 0.44, '#3b82f6', 'DIAMOND');
    drawTrailSignButton('RESORT SETTINGS', height * 0.56, '#64748b', 'GEAR');
    drawTrailSignButton('RETURN TO SUMMIT', height * 0.72, '#ef4444', 'RESORT');

  } else if (gameState === 'PAUSED') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    const cardW = Math.min(width * 0.88, 400);
    const cardH = height * 0.76;
    const cardX = (width - cardW) / 2;
    const cardY = height * 0.12;

    drawSkiPassCard(cardX, cardY, cardW, cardH, 'SAFETY PAUSE');

    drawTrailSignButton('RESUME DESCENT', height * 0.36, '#10b981', 'CIRCLE');
    drawTrailSignButton('RESTART RUN', height * 0.48, '#0284c7', 'SQUARE');
    drawTrailSignButton('SETTINGS', height * 0.60, '#64748b', 'GEAR');
    drawTrailSignButton('MAIN SUMMIT', height * 0.72, '#ef4444', 'RESORT');

  } else if (gameState === 'SETTINGS') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    const cardW = Math.min(width * 0.88, 400);
    const cardH = height * 0.76;
    const cardX = (width - cardW) / 2;
    const cardY = height * 0.12;

    drawSkiPassCard(cardX, cardY, cardW, cardH, 'RESORT SETTINGS');

    drawTrailSignButton(`SOUND EFFECTS: ${settings.sfxOn ? 'ON' : 'OFF'}`, height * 0.34, settings.sfxOn ? '#10b981' : '#64748b', 'GEAR');
    drawTrailSignButton(`VOLUME: ${Math.round(settings.volume * 100)}%`, height * 0.46, '#0284c7', 'GEAR');
    drawTrailSignButton(`HAPTICS: ${settings.haptics ? 'ON' : 'OFF'}`, height * 0.58, settings.haptics ? '#10b981' : '#64748b', 'GEAR');
    drawTrailSignButton('BACK', height * 0.78, '#475569', 'RESORT');

  } else if (gameState === 'SHOP') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 24px system-ui, sans-serif';
    ctx.fillText('CHARACTER SKIN SHOP', width / 2, height * 0.15);
    ctx.fillStyle = '#f59e0b';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.fillText(`HOT COCOA MUGS: ☕ ${cocoaMugs}`, width / 2, height * 0.20);

    let index = 0;
    for (let key in SKINS) {
      const s = SKINS[key];
      const skinY = height * 0.28 + index * 80;
      const isEquipped = equippedSkin === s.id;
      const isUnlocked = unlockedSkins.includes(s.id);

      ctx.fillStyle = isEquipped ? '#065f46' : '#1e293b';
      ctx.fillRect(width * 0.12, skinY, width * 0.76, 65);
      ctx.strokeStyle = isEquipped ? '#10b981' : '#334155';
      ctx.lineWidth = 2;
      ctx.strokeRect(width * 0.12, skinY, width * 0.76, 65);

      ctx.fillStyle = s.suitColor;
      ctx.beginPath();
      ctx.arc(width * 0.22, skinY + 32, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 16px system-ui, sans-serif';
      ctx.fillText(s.name, width * 0.30, skinY + 30);

      ctx.textAlign = 'right';
      ctx.font = '600 14px system-ui, sans-serif';
      if (isEquipped) {
        ctx.fillStyle = '#34d399';
        ctx.fillText('EQUIPPED', width * 0.82, skinY + 38);
      } else if (isUnlocked) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('SELECT', width * 0.82, skinY + 38);
      } else {
        ctx.fillStyle = cocoaMugs >= s.cost ? '#f59e0b' : '#94a3b8';
        ctx.fillText(`☕ ${s.cost}`, width * 0.82, skinY + 38);
      }

      index++;
    }
    ctx.textAlign = 'center';
    drawTrailSignButton('RETURN TO HUB', height * 0.84, '#64748b', 'RESORT');

  } else if (gameState === 'LEADERBOARD') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '800 24px system-ui, sans-serif';
    ctx.fillText('TOP 10 DESCENT RECORDS', width / 2, height * 0.15);

    leaderboard.forEach((entry, idx) => {
      const rowY = height * 0.24 + idx * 38;
      ctx.fillStyle = idx === 0 ? '#f59e0b' : '#f8fafc';
      ctx.font = '600 16px monospace, sans-serif';
      ctx.fillText(`#${idx + 1}   ${entry.initials}   ${entry.distance}m`, width / 2, rowY);
    });

    drawTrailSignButton('RETURN TO HUB', height * 0.84, '#64748b', 'RESORT');

  } else if (gameState === 'COUNTDOWN') {
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 72px system-ui, sans-serif';
    ctx.fillText(countdownTimer > 0 ? countdownTimer : 'GO!', width / 2, height / 2);

  } else if (gameState === 'PLAYING') {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#0f172a';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillText(`DISTANCE: ${Math.floor(distance)}m`, width - 20, 40);
    ctx.fillText(`☕ ${runMugsCollected}`, width - 20, 65);

  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    const cardW = Math.min(width * 0.88, 420);
    const cardH = height * 0.78;
    const cardX = (width - cardW) / 2;
    const cardY = height * 0.12;

    drawSkiPassCard(cardX, cardY, cardW, cardH, 'INCIDENT REPORT: AVALANCHE');

    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`DISTANCE SURVIVED: ${Math.floor(distance)}m`, width / 2, cardY + 100);
    ctx.fillText(`COCOA MUGS: ☕ ${runMugsCollected}`, width / 2, cardY + 130);

    if (isHighScoreRun && !scoreSubmitted) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = '800 17px system-ui, sans-serif';
      ctx.fillText('★ NEW SUMMIT RECORD! ★', width / 2, cardY + 175);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillText('TYPE YOUR 3 INITIALS BELOW:', width / 2, cardY + 200);

      drawTrailSignButton('RECORD SCORE', height * 0.68, '#f59e0b', 'DIAMOND');

    } else {
      if (scoreSubmitted) {
        ctx.fillStyle = '#10b981';
        ctx.font = '700 15px system-ui, sans-serif';
        ctx.fillText('RECORD STAMPED ON LEADERBOARD!', width / 2, cardY + 180);
      }

      drawTrailSignButton('EXPRESS RETRY', height * 0.62, '#10b981', 'CIRCLE');
      drawTrailSignButton('RESORT LODGE', height * 0.72, '#ef4444', 'RESORT');
    }
  }
}

// --- MAIN ENGINE LOOP ---
let lastFrameTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
