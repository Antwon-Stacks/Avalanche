<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avalanche Escape</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0284c7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color: #0f172a;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

<script>
// --- LOCAL STORAGE & SETTINGS ---
const STORAGE_PREFIX = 'avalanche_escape_';
let bestDistance = parseInt(localStorage.getItem(STORAGE_PREFIX + 'best')) || 0;
let cocoaMugs = parseInt(localStorage.getItem(STORAGE_PREFIX + 'mugs')) || 0;
let unlockedSkins = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'skins')) || ['default'];
let equippedSkin = localStorage.getItem(STORAGE_PREFIX + 'equipped_skin') || 'default';
let leaderboard = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'leaderboard')) || [
  { initials: 'ALP', distance: 1500 },
  { initials: 'SNW', distance: 1200 },
  { initials: 'ICE', distance: 950 },
  { initials: 'SKI', distance: 750 },
  { initials: 'BRR', distance: 500 }
];

let settings = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'settings')) || {
  sfxOn: true,
  volume: 0.8,
  haptics: true
};

const SKINS = {
  default: { id: 'default', name: 'Alpine Racer', cost: 0, suitColor: '#ef4444', scarfColor: '#f1f5f9', accentColor: '#38bdf8' },
  neon: { id: 'neon', name: 'Neon Nitro', cost: 20, suitColor: '#06b6d4', scarfColor: '#f43f5e', accentColor: '#a855f7' },
  retro: { id: 'retro', name: 'Retro Shredder', cost: 40, suitColor: '#f59e0b', scarfColor: '#10b981', accentColor: '#3b82f6' },
  gold: { id: 'gold', name: 'Golden Summit', cost: 75, suitColor: '#eab308', scarfColor: '#ffffff', accentColor: '#0f172a' }
};

// In-Game Arcade High Score Initials Selector State
let isHighScoreRun = false;
let initialsIndices = [18, 10, 8]; // 'S', 'K', 'I'
let activeInitialSlot = 0;
let scoreSubmitted = false;
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');

function saveState() {
  localStorage.setItem(STORAGE_PREFIX + 'best', bestDistance);
  localStorage.setItem(STORAGE_PREFIX + 'mugs', cocoaMugs);
  localStorage.setItem(STORAGE_PREFIX + 'skins', JSON.stringify(unlockedSkins));
  localStorage.setItem(STORAGE_PREFIX + 'equipped_skin', equippedSkin);
  localStorage.setItem(STORAGE_PREFIX + 'leaderboard', JSON.stringify(leaderboard));
  localStorage.setItem(STORAGE_PREFIX + 'settings', JSON.stringify(settings));
}

function triggerHaptic(pattern) {
  if (settings.haptics && navigator.vibrate) {
    navigator.vibrate(pattern);
  }
}

function checkHighScore(newDist) {
  if (newDist <= 0) return false;
  return leaderboard.length < 10 || newDist > leaderboard[leaderboard.length - 1].distance;
}

function submitHighScore(newDist) {
  const chosenInitials = initialsIndices.map(idx => ALPHABET[idx]).join('');
  leaderboard.push({ initials: chosenInitials, distance: Math.floor(newDist) });
  leaderboard.sort((a, b) => b.distance - a.distance);
  if (leaderboard.length > 10) leaderboard.pop();
  scoreSubmitted = true;
  saveState();
}

// --- SYNTHESIZED WEB AUDIO ENGINE ---
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.rumbleGain = null;
    this.rumbleSource = null;
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();
    this.setupRumble();
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setupRumble() {
    if (!this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    this.rumbleSource = this.ctx.createBufferSource();
    this.rumbleSource.buffer = noiseBuffer;
    this.rumbleSource.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 110;

    this.rumbleGain = this.ctx.createGain();
    this.rumbleGain.gain.value = 0.0;

    this.rumbleSource.connect(filter);
    filter.connect(this.rumbleGain);
    this.rumbleGain.connect(this.ctx.destination);
    this.rumbleSource.start();
  }

  setRumbleVolume(volume) {
    if (this.rumbleGain && this.ctx) {
      const vol = settings.sfxOn ? Math.min(volume * settings.volume, 0.4) : 0;
      this.rumbleGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);
    }
  }

  playCarve() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playJump() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.25 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
  }

  playPickup() {
    if (!this.ctx || !settings.sfxOn) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = this.ctx.currentTime + (idx * 0.05);
      gain.gain.setValueAtTime(0.22 * settings.volume, startTime);
      gain.gain.linearRampToValueAtTime(0.01, startTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.1);
    });
  }

  playCrash() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(25, this.ctx.currentTime + 0.38);
    gain.gain.setValueAtTime(0.45 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.38);
  }

  playClick() {
    if (!this.ctx || !settings.sfxOn) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.15 * settings.volume, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.04);
  }
}

const audio = new AudioEngine();

// --- CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resizeCanvas() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- GAME STATE ---
let gameState = 'MENU'; // MENU, SETTINGS, SHOP, LEADERBOARD, COUNTDOWN, PLAYING, PAUSED, GAMEOVER
let previousMenuState = 'MENU';
let countdownTimer = 3;
let countdownInterval = null;

// World & Camera
let distance = 0;
let runMugsCollected = 0;
let cameraY = 0;
let screenShake = 0;
let timeAlive = 0;

// Ambient Snowflakes
const ambientSnow = Array.from({ length: 50 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 2.5 + 1,
  speed: Math.random() * 80 + 40,
  drift: Math.random() * 30 - 15
}));

// Player Setup
const player = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  z: 0,
  vz: 0,
  angle: 0,
  isJumping: false,
  isTucking: false,
  tuckTimer: 0,
  squashX: 1,
  squashY: 1,
  scarfWave: 0,
  reset() {
    this.x = width / 2;
    this.y = 0;
    this.vx = 0;
    this.vy = 280;
    this.z = 0;
    this.vz = 0;
    this.angle = 0;
    this.isJumping = false;
    this.isTucking = false;
    this.tuckTimer = 0;
    this.squashX = 1;
    this.squashY = 1;
    this.scarfWave = 0;
  }
};

// Avalanche Setup
let avalancheY = -400;
let avalancheSpeed = 260;

// Entities & Particles
let obstacles = [];
let particles = [];
let carveTrails = [];

// --- PROCEDURAL GENERATION ---
function spawnObstaclesAhead() {
  const spawnDistance = player.y + height + 350;
  const lastSpawnY = obstacles.length > 0 ? obstacles[obstacles.length - 1].y : player.y + 250;

  if (lastSpawnY < spawnDistance) {
    const nextY = lastSpawnY + 65 + Math.random() * 45;
    const slopeMargin = width * 0.12;
    const nextX = slopeMargin + Math.random() * (width - slopeMargin * 2);

    const rand = Math.random();
    let type = 'TREE';
    if (rand < 0.35) type = 'TREE';
    else if (rand < 0.58) type = 'BOULDER';
    else if (rand < 0.72) type = 'ICE';
    else if (rand < 0.86) type = 'RAMP';
    else type = 'MUG';

    obstacles.push({ x: nextX, y: nextY, type, hit: false, steamTimer: Math.random() * 10 });
  }
}

// --- PARTICLE SYSTEM ---
function addSnowburst(x, y, count = 12, colorOverride = null) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      size: 3 + Math.random() * 5,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color: colorOverride || (Math.random() < 0.6 ? '#ffffff' : '#bae6fd')
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = carveTrails.length - 1; i >= 0; i--) {
    carveTrails[i].alpha -= dt * 0.75;
    if (carveTrails[i].alpha <= 0) carveTrails.splice(i, 1);
  }

  ambientSnow.forEach(s => {
    s.y += (s.speed + (gameState === 'PLAYING' ? player.vy * 0.5 : 20)) * dt;
    s.x += s.drift * dt;
    if (s.y > height) { s.y = -10; s.x = Math.random() * width; }
    if (s.x < 0) s.x = width;
    if (s.x > width) s.x = 0;
  });
}

// --- CONTROLS & HYBRID INPUT HANDLING ---
let touchStartX = 0;
let touchStartY = 0;
let isPointerDown = false;
let pointerCurrentX = 0;
let pointerCurrentY = 0;
const SWIPE_THRESHOLD = 22;

function triggerSteer(dir) {
  if (gameState !== 'PLAYING') return;
  player.vx += dir * 240;
  player.angle = dir * 0.38;
  audio.playCarve();
  addSnowburst(player.x, player.y - cameraY, 4);
}

function triggerJump() {
  if (gameState !== 'PLAYING') return;
  if (!player.isJumping) {
    player.isJumping = true;
    player.vz = 370;
    audio.playJump();
    triggerHaptic(20);
    player.squashX = 0.75;
    player.squashY = 1.25;
  }
}

function triggerTuck() {
  if (gameState !== 'PLAYING') return;
  player.isTucking = true;
  player.tuckTimer = 1.2;
  triggerHaptic([15, 30]);
  addSnowburst(player.x, player.y - cameraY, 8);
}

function togglePause() {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSED';
    screenShake = 0; // Clear screen shake on pause
    audio.setRumbleVolume(0);
  } else if (gameState === 'PAUSED') {
    gameState = 'PLAYING';
  }
}

window.addEventListener('touchstart', (e) => {
  audio.init();
  audio.resume();
  const touch = e.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  pointerCurrentX = touch.clientX;
  pointerCurrentY = touch.clientY;
  isPointerDown = true;

  handleMenuTouch(touchStartX, touchStartY);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (!isPointerDown) return;
  const touch = e.changedTouches[0];
  pointerCurrentX = touch.clientX;
  pointerCurrentY = touch.clientY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;

  if (gameState !== 'PLAYING') return;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  // Pause Button Check
  if (touchStartX > width - 60 && touchStartY < 60) {
    togglePause();
    return;
  }

  // Swipe Action Recognition
  if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
    if (Math.abs(dx) > Math.abs(dy)) {
      triggerSteer(dx > 0 ? 1 : -1);
    } else {
      if (dy < 0) triggerJump();
      else triggerTuck();
    }
  }
}, { passive: false });

// Keyboard Fallback
const keys = {};
window.addEventListener('keydown', (e) => {
  audio.init();
  audio.resume();
  keys[e.code] = true;

  if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
    return;
  }

  if (gameState === 'PLAYING') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') triggerSteer(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') triggerSteer(1);
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') triggerJump();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerTuck();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// --- GAME FLOW LOGIC ---
function startCountdown() {
  gameState = 'COUNTDOWN';
  screenShake = 0; // Fix screen shake bug on restart!
  countdownTimer = 3;
  player.reset();
  avalancheY = -400;
  avalancheSpeed = 260;
  distance = 0;
  runMugsCollected = 0;
  timeAlive = 0;
  isHighScoreRun = false;
  scoreSubmitted = false;
  obstacles = [];
  particles = [];
  carveTrails = [];

  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdownTimer--;
    if (countdownTimer <= 0) {
      clearInterval(countdownInterval);
      gameState = 'PLAYING';
    }
  }, 1000);
}

function handleMenuTouch(x, y) {
  if (gameState === 'MENU') {
    if (y > height * 0.48 && y < height * 0.56) startCountdown();
    if (y > height * 0.58 && y < height * 0.66) gameState = 'SHOP';
    if (y > height * 0.68 && y < height * 0.76) gameState = 'LEADERBOARD';
    if (y > height * 0.78 && y < height * 0.86) { previousMenuState = 'MENU'; gameState = 'SETTINGS'; }
  } else if (gameState === 'PAUSED') {
    if (y > height * 0.38 && y < height * 0.46) gameState = 'PLAYING';
    if (y > height * 0.48 && y < height * 0.56) startCountdown();
    if (y > height * 0.58 && y < height * 0.66) { previousMenuState = 'PAUSED'; gameState = 'SETTINGS'; }
    if (y > height * 0.68 && y < height * 0.76) { screenShake = 0; gameState = 'MENU'; }
  } else if (gameState === 'SETTINGS') {
    if (y > height * 0.34 && y < height * 0.42) {
      settings.sfxOn = !settings.sfxOn;
      saveState();
    }
    if (y > height * 0.46 && y < height * 0.54) {
      if (x < width / 2) settings.volume = Math.max(0, settings.volume - 0.1);
      else settings.volume = Math.min(1.0, settings.volume + 0.1);
      saveState();
    }
    if (y > height * 0.58 && y < height * 0.66) {
      settings.haptics = !settings.haptics;
      triggerHaptic(30);
      saveState();
    }
    if (y > height * 0.78) gameState = previousMenuState;
  } else if (gameState === 'SHOP') {
    let index = 0;
    for (let key in SKINS) {
      const s = SKINS[key];
      const skinY = height * 0.28 + index * 80;
      if (y > skinY && y < skinY + 65) {
        if (unlockedSkins.includes(s.id)) {
          equippedSkin = s.id;
          saveState();
        } else if (cocoaMugs >= s.cost) {
          cocoaMugs -= s.cost;
          unlockedSkins.push(s.id);
          equippedSkin = s.id;
          saveState();
          triggerHaptic([30, 50]);
        }
      }
      index++;
    }
    if (y > height * 0.84) gameState = 'MENU';
  } else if (gameState === 'LEADERBOARD') {
    if (y > height * 0.84) gameState = 'MENU';
  } else if (gameState === 'GAMEOVER') {
    // In-Canvas Arcade Initials Entry Controls
    if (isHighScoreRun && !scoreSubmitted) {
      const slotWidth = 50;
      const startX = width / 2 - 80;
      const pickerY = height * 0.54;

      for (let i = 0; i < 3; i++) {
        const slotX = startX + i * 55;
        // Up Arrow Click
        if (x > slotX && x < slotX + slotWidth && y > pickerY - 35 && y < pickerY - 5) {
          initialsIndices[i] = (initialsIndices[i] + 1) % ALPHABET.length;
          activeInitialSlot = i;
          audio.playClick();
          return;
        }
        // Down Arrow Click
        if (x > slotX && x < slotX + slotWidth && y > pickerY + 45 && y < pickerY + 75) {
          initialsIndices[i] = (initialsIndices[i] - 1 + ALPHABET.length) % ALPHABET.length;
          activeInitialSlot = i;
          audio.playClick();
          return;
        }
        // Direct Slot Tap
        if (x > slotX && x < slotX + slotWidth && y > pickerY && y < pickerY + 40) {
          initialsIndices[i] = (initialsIndices[i] + 1) % ALPHABET.length;
          activeInitialSlot = i;
          audio.playClick();
          return;
        }
      }

      // Submit Score Button
      if (y > height * 0.68 && y < height * 0.75) {
        submitHighScore(distance);
        audio.playPickup();
        return;
      }
    } else {
      // Action Buttons when High Score submitted or normal run ended
      if (y > height * 0.62 && y < height * 0.70) startCountdown(); // Restart
      if (y > height * 0.72 && y < height * 0.80) { screenShake = 0; gameState = 'MENU'; } // Main Menu
    }
  }
}

// --- ENGINE UPDATE ---
function update(dt) {
  if (gameState !== 'PLAYING') {
    audio.setRumbleVolume(0);
    return;
  }

  timeAlive += dt;

  // Tap & Hold Steering
  if (isPointerDown) {
    if (pointerCurrentX < width * 0.42) {
      player.vx -= 480 * dt;
      player.angle = -0.32;
    } else if (pointerCurrentX > width * 0.58) {
      player.vx += 480 * dt;
      player.angle = 0.32;
    }
  }

  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx -= 480 * dt; player.angle = -0.32; }
  if (keys['ArrowRight'] || keys['KeyD']) { player.vx += 480 * dt; player.angle = 0.32; }

  if (player.isTucking) {
    player.tuckTimer -= dt;
    if (player.tuckTimer <= 0) player.isTucking = false;
  }

  const targetVy = (280 + distance * 0.045) * (player.isTucking ? 1.5 : 1.0);
  player.vy += (targetVy - player.vy) * 2.2 * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.vx *= 0.89;
  player.angle *= 0.86;
  player.scarfWave += dt * 12;

  const margin = width * 0.08;
  if (player.x < margin) { player.x = margin; player.vx = 0; }
  if (player.x > width - margin) { player.x = width - margin; player.vx = 0; }

  if (player.isJumping) {
    player.z += player.vz * dt;
    player.vz -= 920 * dt;
    if (player.z <= 0) {
      player.z = 0;
      player.vz = 0;
      player.isJumping = false;
      player.squashX = 1.35;
      player.squashY = 0.65;
      addSnowburst(player.x, player.y - cameraY, 12);
      triggerHaptic(20);
    }
  }

  player.squashX += (1 - player.squashX) * 8 * dt;
  player.squashY += (1 - player.squashY) * 8 * dt;

  if (!player.isJumping && Math.abs(player.vx) > 25) {
    carveTrails.push({
      x: player.x,
      y: player.y,
      alpha: 0.85,
      skinColor: SKINS[equippedSkin].suitColor
    });
  }

  cameraY = player.y - height * 0.35;
  distance = player.y / 10;
  if (distance > bestDistance) bestDistance = Math.floor(distance);

  avalancheSpeed = 260 + (distance * 0.048);
  avalancheY += avalancheSpeed * dt;

  const avalancheProximity = player.y - avalancheY;
  const proximityRatio = Math.max(0, 1 - (avalancheProximity / 600));
  screenShake = proximityRatio * 15;
  audio.setRumbleVolume(proximityRatio);

  if (avalancheY >= player.y - 10) {
    triggerGameOver();
  }

  spawnObstaclesAhead();
  updateObstaclesAndCollisions();
  updateParticles(dt);
}

function updateObstaclesAndCollisions() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];

    if (obs.y < cameraY - 200) {
      obstacles.splice(i, 1);
      continue;
    }

    obs.steamTimer += 0.05;

    const dx = player.x - obs.x;
    const dy = player.y - obs.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 34) {
      if (obs.type === 'MUG') {
        if (!obs.hit) {
          obs.hit = true;
          cocoaMugs++;
          runMugsCollected++;
          audio.playPickup();
          triggerHaptic([30, 30]);
          addSnowburst(player.x, player.y - cameraY, 15, '#eab308');
          saveState();
        }
      } else if (obs.type === 'RAMP') {
        if (!obs.hit && !player.isJumping) {
          obs.hit = true;
          player.isJumping = true;
          player.vz = 580;
          audio.playJump();
          triggerHaptic(40);
          player.squashX = 0.6;
          player.squashY = 1.4;
          addSnowburst(player.x, player.y - cameraY, 16);
        }
      } else if (player.isJumping || player.z > 18) {
        // Clear obstacle cleanly in mid-air
      } else {
        if (!obs.hit) {
          if (obs.type === 'ICE') {
            obs.hit = true;
            player.vx = (Math.random() < 0.5 ? 1 : -1) * 380;
            player.angle = Math.PI * 0.6;
            audio.playCarve();
            triggerHaptic(30);
          } else if (obs.type === 'TREE' || obs.type === 'BOULDER') {
            obs.hit = true;
            player.vy = 40;
            screenShake = 22;
            audio.playCrash();
            triggerHaptic([60, 40, 60]);
            addSnowburst(player.x, player.y - cameraY, 24);
          }
        }
      }
    }
  }
}

function triggerGameOver() {
  gameState = 'GAMEOVER';
  screenShake = 0; // Instantly zero out residual screen shake!
  audio.playCrash();
  triggerHaptic([100, 50, 100]);
  isHighScoreRun = checkHighScore(distance);
  scoreSubmitted = false;
  saveState();
}

// --- ADVANCED RENDER ENGINE ---
function render() {
  ctx.clearRect(0, 0, width, height);

  ctx.save();
  if (screenShake > 0.1 && gameState === 'PLAYING') {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
  }

  drawAuroraSky();
  drawSnowSlope();

  if (['PLAYING', 'COUNTDOWN', 'PAUSED', 'GAMEOVER'].includes(gameState)) {
    drawCarveTrails();
    drawObstacles();
    drawParticles();
    drawPlayer();
    drawAvalancheWall();
    drawSpeedLines();
  }

  drawAmbientAtmosphere();
  ctx.restore();

  drawUI();
}

// 1. Dynamic Aurora Sky
function drawAuroraSky() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.45);
  skyGrad.addColorStop(0, '#0f172a');
  skyGrad.addColorStop(0.5, '#0284c7');
  skyGrad.addColorStop(1, '#bae6fd');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.globalAlpha = 0.35;
  const time = timeAlive * 0.5;
  const auroraGrad = ctx.createLinearGradient(0, 0, width, height * 0.3);
  auroraGrad.addColorStop(0, '#10b981');
  auroraGrad.addColorStop(0.5, '#06b6d4');
  auroraGrad.addColorStop(1, '#a855f7');
  ctx.fillStyle = auroraGrad;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let x = 0; x <= width; x += 30) {
    const y = Math.sin(x * 0.01 + time) * 35 + height * 0.15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(width, 0);
  ctx.fill();
  ctx.restore();
}

// 2. Snow Slope
function drawSnowSlope() {
  const slopeGrad = ctx.createLinearGradient(0, height * 0.25, 0, height);
  slopeGrad.addColorStop(0, '#f8fafc');
  slopeGrad.addColorStop(0.6, '#e2e8f0');
  slopeGrad.addColorStop(1, '#cbd5e1');
  ctx.fillStyle = slopeGrad;
  ctx.fillRect(0, height * 0.25, width, height);

  const margin = width * 0.08;
  const treeGradLeft = ctx.createLinearGradient(0, 0, margin, 0);
  treeGradLeft.addColorStop(0, '#022c22');
  treeGradLeft.addColorStop(1, '#065f46');
  ctx.fillStyle = treeGradLeft;
  ctx.fillRect(0, 0, margin, height);

  const treeGradRight = ctx.createLinearGradient(width - margin, 0, width, 0);
  treeGradRight.addColorStop(0, '#065f46');
  treeGradRight.addColorStop(1, '#022c22');
  ctx.fillStyle = treeGradRight;
  ctx.fillRect(width - margin, 0, margin, height);
}

// 3. Carve Trails
function drawCarveTrails() {
  carveTrails.forEach(t => {
    ctx.save();
    ctx.globalAlpha = t.alpha * 0.6;
    ctx.fillStyle = t.skinColor;
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y - cameraY, 2.5, 0, Math.PI * 2);
    ctx.arc(t.x + 3, t.y - cameraY, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// 4. Vector Obstacles
function drawObstacles() {
  obstacles.forEach(obs => {
    if (obs.hit && obs.type === 'MUG') return;

    const screenY = obs.y - cameraY;
    if (screenY < -60 || screenY > height + 60) return;

    if (obs.type === 'TREE') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY + 6, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(obs.x - 4, screenY - 6, 8, 14);

      const layers = [
        { y: screenY - 8, w: 22, h: 22, col: '#065f46' },
        { y: screenY - 22, w: 17, h: 20, col: '#047857' },
        { y: screenY - 36, w: 12, h: 18, col: '#10b981' }
      ];
      layers.forEach(l => {
        ctx.fillStyle = l.col;
        ctx.beginPath();
        ctx.moveTo(obs.x, l.y - l.h);
        ctx.lineTo(obs.x - l.w, l.y);
        ctx.lineTo(obs.x + l.w, l.y);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(obs.x, l.y - l.h);
        ctx.lineTo(obs.x - l.w * 0.5, l.y - l.h * 0.5);
        ctx.lineTo(obs.x + l.w * 0.5, l.y - l.h * 0.5);
        ctx.fill();
      });

    } else if (obs.type === 'BOULDER') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY + 4, 18, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY, 18, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.ellipse(obs.x - 4, screenY - 3, 10, 6, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.ellipse(obs.x - 2, screenY - 6, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

    } else if (obs.type === 'ICE') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.55)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY, 26, 14, 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.moveTo(obs.x - 12, screenY - 2);
      ctx.lineTo(obs.x + 8, screenY - 4);
      ctx.stroke();

    } else if (obs.type === 'RAMP') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
      ctx.beginPath();
      ctx.ellipse(obs.x, screenY + 8, 22, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.moveTo(obs.x - 22, screenY + 10);
      ctx.lineTo(obs.x + 22, screenY + 10);
      ctx.lineTo(obs.x, screenY - 14);
      ctx.fill();

      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.moveTo(obs.x - 18, screenY + 8);
      ctx.lineTo(obs.x + 18, screenY + 8);
      ctx.lineTo(obs.x, screenY - 10);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(obs.x, screenY - 6);
      ctx.lineTo(obs.x - 5, screenY + 2);
      ctx.lineTo(obs.x + 5, screenY + 2);
      ctx.fill();

    } else if (obs.type === 'MUG') {
      ctx.save();
      ctx.fillStyle = 'rgba(234, 179, 8, 0.35)';
      ctx.beginPath();
      ctx.arc(obs.x, screenY, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(obs.x - 8, screenY - 8, 16, 16);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(obs.x - 6, screenY - 6, 12, 4);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(obs.x + 9, screenY, 4, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 1.5;
      const steamY = screenY - 10 - Math.sin(obs.steamTimer) * 4;
      ctx.beginPath();
      ctx.moveTo(obs.x - 3, steamY);
      ctx.lineTo(obs.x - 3, steamY - 6);
      ctx.moveTo(obs.x + 3, steamY - 2);
      ctx.lineTo(obs.x + 3, steamY - 8);
      ctx.stroke();
      ctx.restore();
    }
  });
}

// 5. Player Vector Character
function drawPlayer() {
  const screenY = player.y - cameraY - player.z;
  const currentSkin = SKINS[equippedSkin];

  ctx.save();
  ctx.translate(player.x, screenY);
  ctx.rotate(player.angle);
  ctx.scale(player.squashX, player.squashY);

  const shadowScale = 1 + player.z * 0.003;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 14 + player.z * 0.7, 14 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = currentSkin.accentColor;
  ctx.fillRect(-9, -18, 4, 34);
  ctx.fillRect(5, -18, 4, 34);

  const wave = Math.sin(player.scarfWave) * 6;
  ctx.fillStyle = currentSkin.scarfColor;
  ctx.beginPath();
  ctx.moveTo(0, 2);
  ctx.quadraticCurveTo(-10 + wave, 14, -6 + wave, 24);
  ctx.quadraticCurveTo(0, 14, 0, 2);
  ctx.fill();

  ctx.fillStyle = currentSkin.suitColor;
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, -2, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-5, -5, 10, 4);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-3, -5, 3, 2);

  ctx.restore();
}

// 6. Volumetric Avalanche Snow Wall
function drawAvalancheWall() {
  const wallScreenY = avalancheY - cameraY;
  if (wallScreenY < -120) return;

  const prox = Math.max(0, 1 - ((player.y - avalancheY) / 500));
  if (prox > 0.6) {
    ctx.fillStyle = `rgba(239, 68, 68, ${ (prox - 0.6) * 0.4 })`;
    ctx.fillRect(0, 0, width, height);
  }

  const grad = ctx.createLinearGradient(0, wallScreenY - 100, 0, wallScreenY + 60);
  grad.addColorStop(0, 'rgba(248, 250, 252, 0.98)');
  grad.addColorStop(0.5, 'rgba(226, 232, 240, 0.94)');
  grad.addColorStop(1, 'rgba(148, 163, 184, 0.0)');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(width, 0);
  ctx.lineTo(width, wallScreenY + 30);

  const time = Date.now() * 0.006;
  for (let x = width; x >= 0; x -= 30) {
    const wave = Math.sin(x * 0.02 + time) * 22;
    ctx.lineTo(x, wallScreenY + wave);
  }
  ctx.closePath();
  ctx.fill();
}

// 7. Radial Speed Lines
function drawSpeedLines() {
  if (!player.isTucking && player.z <= 0) return;

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2;
  const count = player.isTucking ? 16 : 8;
  for (let i = 0; i < count; i++) {
    const x = Math.random() * width;
    const y = Math.random() * height;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - 0.5) * 10, y + 40 + Math.random() * 40);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawAmbientAtmosphere() {
  ctx.fillStyle = '#ffffff';
  ambientSnow.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- MODERNIZED UI & OVERLAYS ---
function drawUI() {
  ctx.textAlign = 'center';

  if (gameState === 'MENU') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 36px system-ui, sans-serif';
    ctx.fillText('AVALANCHE ESCAPE', width / 2, height * 0.22);

    ctx.fillStyle = '#f59e0b';
    ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillText(`BEST DISTANCE: ${bestDistance}m  |  MUGS: ☕ ${cocoaMugs}`, width / 2, height * 0.30);

    drawButton('START DESCENT', height * 0.48, '#10b981');
    drawButton('SKIN SHOP', height * 0.58, '#0284c7');
    drawButton('LEADERBOARD', height * 0.68, '#3b82f6');
    drawButton('SETTINGS', height * 0.78, '#64748b');

  } else if (gameState === 'PAUSED') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '900 36px system-ui, sans-serif';
    ctx.fillText('GAME PAUSED', width / 2, height * 0.25);

    drawButton('RESUME', height * 0.38, '#10b981');
    drawButton('RESTART', height * 0.48, '#0284c7');
    drawButton('SETTINGS', height * 0.58, '#64748b');
    drawButton('MAIN MENU', height * 0.68, '#ef4444');

  } else if (gameState === 'SETTINGS') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 28px system-ui, sans-serif';
    ctx.fillText('GAME SETTINGS', width / 2, height * 0.20);

    drawButton(`SOUND EFFECTS: ${settings.sfxOn ? 'ON' : 'OFF'}`, height * 0.34, settings.sfxOn ? '#10b981' : '#64748b');
    drawButton(`SFX VOLUME: ${Math.round(settings.volume * 100)}%`, height * 0.46, '#0284c7');
    drawButton(`HAPTIC FEEDBACK: ${settings.haptics ? 'ON' : 'OFF'}`, height * 0.58, settings.haptics ? '#10b981' : '#64748b');
    drawButton('BACK', height * 0.78, '#475569');

  } else if (gameState === 'SHOP') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.fillText('CHARACTER SKIN SHOP', width / 2, height * 0.15);
    ctx.fillStyle = '#f59e0b';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText(`HOT COCOA MUGS: ☕ ${cocoaMugs}`, width / 2, height * 0.20);

    let index = 0;
    for (let key in SKINS) {
      const s = SKINS[key];
      const skinY = height * 0.28 + index * 80;
      const isEquipped = equippedSkin === s.id;
      const isUnlocked = unlockedSkins.includes(s.id);

      ctx.fillStyle = isEquipped ? '#065f46' : '#1e293b';
      ctx.fillRect(width * 0.12, skinY, width * 0.76, 65);
      ctx.strokeStyle = isEquipped ? '#10b981' : '#334155';
      ctx.lineWidth = 2;
      ctx.strokeRect(width * 0.12, skinY, width * 0.76, 65);

      ctx.fillStyle = s.suitColor;
      ctx.beginPath();
      ctx.arc(width * 0.22, skinY + 32, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 16px system-ui, sans-serif';
      ctx.fillText(s.name, width * 0.30, skinY + 30);

      ctx.textAlign = 'right';
      ctx.font = '600 14px system-ui, sans-serif';
      if (isEquipped) {
        ctx.fillStyle = '#34d399';
        ctx.fillText('EQUIPPED', width * 0.82, skinY + 38);
      } else if (isUnlocked) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('SELECT', width * 0.82, skinY + 38);
      } else {
        ctx.fillStyle = cocoaMugs >= s.cost ? '#f59e0b' : '#94a3b8';
        ctx.fillText(`☕ ${s.cost}`, width * 0.82, skinY + 38);
      }

      index++;
    }
    ctx.textAlign = 'center';
    drawButton('BACK TO MENU', height * 0.84, '#64748b');

  } else if (gameState === 'LEADERBOARD') {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.fillText('TOP 10 DESCENT RECORDS', width / 2, height * 0.15);

    leaderboard.forEach((entry, idx) => {
      const rowY = height * 0.24 + idx * 38;
      ctx.fillStyle = idx === 0 ? '#f59e0b' : '#f8fafc';
      ctx.font = '600 16px monospace, sans-serif';
      ctx.fillText(`#${idx + 1}   ${entry.initials}   ${entry.distance}m`, width / 2, rowY);
    });

    drawButton('BACK TO MENU', height * 0.84, '#64748b');

  } else if (gameState === 'COUNTDOWN') {
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 72px system-ui, sans-serif';
    ctx.fillText(countdownTimer > 0 ? countdownTimer : 'GO!', width / 2, height / 2);

  } else if (gameState === 'PLAYING') {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0f172a';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillText(`DISTANCE: ${Math.floor(distance)}m`, 20, 40);
    ctx.fillText(`☕ ${runMugsCollected}`, 20, 65);

    // Pause Button
    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
    ctx.beginPath();
    ctx.arc(width - 35, 35, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(width - 40, 26, 4, 18);
    ctx.fillRect(width - 34, 26, 4, 18);

  } else if (gameState === 'GAMEOVER') {
    // Glassmorphic Card Overlay
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, width, height);

    // Card Container
    const cardWidth = Math.min(width * 0.88, 420);
    const cardX = (width - cardWidth) / 2;
    const cardY = height * 0.12;
    const cardHeight = height * 0.78;

    ctx.fillStyle = 'rgba(30, 41, 59, 0.75)';
    ctx.fillRect(cardX, cardY, cardWidth, cardHeight);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.strokeRect(cardX, cardY, cardWidth, cardHeight);

    // Dynamic Scaling Title to Fix Truncation Bug
    const titleFontSize = Math.min(28, cardWidth * 0.068);
    ctx.font = `900 ${titleFontSize}px system-ui, sans-serif`;
    ctx.fillStyle = '#ef4444';
    ctx.textAlign = 'center';
    ctx.fillText('AVALANCHE CAUGHT YOU!', width / 2, cardY + 50);

    // Run Stats Card
    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText(`DISTANCE SURVIVED: ${Math.floor(distance)}m`, width / 2, cardY + 95);
    ctx.fillText(`HOT COCOA MUGS: ☕ ${runMugsCollected}`, width / 2, cardY + 125);

    // High Score Arcade Initials Selector (Ice Hopper / Arcade Style)
    if (isHighScoreRun && !scoreSubmitted) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = '800 18px system-ui, sans-serif';
      ctx.fillText('★ NEW HIGH SCORE! ★', width / 2, cardY + 165);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillText('TAP ARROWS TO SELECT YOUR INITIALS:', width / 2, cardY + 190);

      const startX = width / 2 - 80;
      const pickerY = height * 0.54;

      for (let i = 0; i < 3; i++) {
        const slotX = startX + i * 55;
        const letter = ALPHABET[initialsIndices[i]];

        // Up Arrow ▲
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(slotX + 25, pickerY - 25);
        ctx.lineTo(slotX + 10, pickerY - 10);
        ctx.lineTo(slotX + 40, pickerY - 10);
        ctx.fill();

        // Letter Box
        ctx.fillStyle = i === activeInitialSlot ? '#0284c7' : '#0f172a';
        ctx.fillRect(slotX, pickerY, 50, 40);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = i === activeInitialSlot ? 3 : 1;
        ctx.strokeRect(slotX, pickerY, 50, 40);

        ctx.fillStyle = '#ffffff';
        ctx.font = '800 22px monospace, sans-serif';
        ctx.fillText(letter, slotX + 25, pickerY + 28);

        // Down Arrow ▼
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(slotX + 25, pickerY + 65);
        ctx.lineTo(slotX + 10, pickerY + 50);
        ctx.lineTo(slotX + 40, pickerY + 50);
        ctx.fill();
      }

      drawButton('SUBMIT SCORE', height * 0.68, '#f59e0b');

    } else {
      if (scoreSubmitted) {
        ctx.fillStyle = '#10b981';
        ctx.font = '700 16px system-ui, sans-serif';
        ctx.fillText('SCORE RECORDED ON LEADERBOARD!', width / 2, cardY + 175);
      }

      drawButton('RESTART DESCENT', height * 0.62, '#10b981');
      drawButton('MAIN MENU', height * 0.72, '#3b82f6');
    }
  }
}

function drawButton(text, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(width * 0.15, y, width * 0.7, 48);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, width / 2, y + 30);
}

// --- MAIN ENGINE LOOP ---
let lastFrameTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
